
[output_pin Nevermore]
pin: gpio18
pwm: true
cycle_time: 0.010
value: 0
shutdown_value: 0

[display_data _default_16x4 nevermore_status]
position: 1, 1
text: "Nevermore: { printer['fan_generic Nevermore'].speed * 100 }%"

[menu __main __control __nevermoreonoff]
type: command
name: Nevermore {'ON' if printer['fan_generic Nevermore'].speed > 0 else 'OFF'}
enable: {'fan_generic Nevermore' in printer}
gcode:
    TOGGLE_NEVERMORE

[menu __main __control __filterspeed]
type: input
enable: {'fan_generic Nevermore' in printer}
name: Filter %: {'%3d' % (menu.input*100)}%
input: {printer["fan_generic Nevermore"].speed}
input_min: 0
input_max: 1
input_step: 0.1
gcode:
    SET_PIN PIN=Nevermore VALUE={menu.input}

[delayed_gcode filter_off]
gcode:
    SET_PIN PIN=Nevermore VALUE=0

[gcode_macro TOGGLE_NEVERMORE]
gcode:
    {% if printer['output_pin Nevermore'].value > 0 %}
      SET_PIN PIN=Nevermore VALUE=0
    {% else %}
      SET_PIN PIN=Nevermore VALUE=1
    {% endif %}